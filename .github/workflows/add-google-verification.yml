name: Add Google verification and Analytics

on:
  push:
    paths:
      - '.github/workflows/add-google-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-google-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Google Search Console and Analytics tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          verification = '<meta name="google-site-verification" content="mluJCMt-jivuf-dvjGim-TNk0M1P4U8DmS8pVMq55Us" />'
          analytics_lines = [
              '<!-- Google tag (gtag.js) -->',
              '<script async src="https://www.googletagmanager.com/gtag/js?id=G-5F1944ZQYE"></script>',
              '<script>',
              '  window.dataLayer = window.dataLayer || [];',
              '  function gtag(){dataLayer.push(arguments);}',
              "  gtag('js', new Date());",
              "  gtag('config', 'G-5F1944ZQYE');",
              '</script>',
          ]
          analytics = '\n  '.join(analytics_lines)

          marker = '<head>'
          pos = text.lower().find(marker)
          if pos == -1:
              raise SystemExit('Tag <head> não encontrada em index.html')
          insert_at = pos + len(marker)

          additions = []
          if verification not in text:
              additions.append(verification)
          if 'G-5F1944ZQYE' not in text:
              additions.append(analytics)

          if additions:
              text = text[:insert_at] + '\n  ' + '\n  '.join(additions) + text[insert_at:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Google tags
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Google tags already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar Google Analytics ao site"
          git push
